<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Graduation Exhibition — Tourism non Tourism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="floating-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">MENU</button>
    <nav id="site-nav" class="side-nav" aria-label="주요 메뉴">
      <a href="#home">HOME</a>
      <a href="#celebration">CELEBRATION</a>
      <a href="#works">WORKS</a>
    </nav>
  </header>

  <main>
    <section id="home" class="panel image-panel dark-panel">
      <img src="assets/source/section-01.png" alt="Home visual" class="panel-image" />
    </section>
    <section id="celebration" class="panel image-panel neutral-panel">
      <img src="assets/source/section-02.png" alt="Celebration visual" class="panel-image" />
    </section>
    <section id="works" class="panel image-panel neutral-panel">
      <img src="assets/source/section-03.png" alt="Works visual" class="panel-image" />
    </section>
  </main>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sideNav = document.querySelector('.side-nav');
    const navLinks = document.querySelectorAll('.side-nav a');
    menuToggle.addEventListener('click', () => {
      const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!expanded));
      sideNav.classList.toggle('is-open');
    });
    navLinks.forEach((link) => {
      link.addEventListener('click', () => {
        sideNav.classList.remove('is-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
