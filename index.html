<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Graduation Exhibition — Tourism non Tourism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="floating-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">MENU</button>
    <nav id="site-nav" class="side-nav" aria-label="주요 메뉴">
      <a href="index.html">HOME</a>
      <a href="celebration.html">CELEBRATION</a>
      <a href="works.html">WORKS</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <img src="assets/source/home.jpg" alt="Home visual" class="panel-image" />
    </section>
  </main>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sideNav = document.querySelector('.side-nav');
    menuToggle.addEventListener('click', () => {
      const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!expanded));
      sideNav.classList.toggle('is-open');
    });
  </script>
  <script src="fullscroll.js"></script>
</body>
</html>
