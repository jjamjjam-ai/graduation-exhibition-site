<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works — 2026 Graduation Exhibition</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="works-page">
  <header class="floating-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">MENU</button>
    <nav id="site-nav" class="side-nav" aria-label="주요 메뉴">
      <a href="index.html">HOME</a>
      <a href="celebration.html">CELEBRATION</a>
      <a href="works.html">WORKS</a>
      <div class="sub-links">
        <a href="works.html#page-4">LIM YONGMIN</a>
        <a href="works.html#page-43">YANG MYOUNGSEOK</a>
        <a href="works.html#page-71">LEE CHANGSOO</a>
        <a href="works.html#page-112">EUN HOSEOK</a>
      </div>
    </nav>
  </header>

  <button class="nav-arrow nav-prev" disabled>←</button>
  <button class="nav-arrow nav-next">→</button>

  <main>
    <div class="h-stage">
      <div class="h-track">
        <div class="slide"><img alt="" class="slide-image" /></div>
        <div class="slide"><img alt="" class="slide-image" /></div>
        <div class="slide"><img alt="" class="slide-image" /></div>
      </div>
    </div>
  </main>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sideNav = document.querySelector('.side-nav');
    menuToggle.addEventListener('click', () => {
      const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!expanded));
      sideNav.classList.toggle('is-open');
    });
    document.querySelectorAll('.side-nav a').forEach(link => {
      link.addEventListener('click', () => {
        sideNav.classList.remove('is-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
  <script src="fullscroll-h.js"></script>
</body>
</html>
