<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celebration — 2026 Graduation Exhibition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="floating-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">MENU</button>
    <nav id="site-nav" class="side-nav" aria-label="주요 메뉴">
      <a href="index.html">HOME</a>
      <a href="celebration.html">CELEBRATION</a>
      <a href="works.html">WORKS</a>
      <div class="sub-links">
        <a href="works.html#page-4">LIM YONGMIN</a>
        <a href="works.html#page-43">YANG MYOUNGSEOK</a>
        <a href="works.html#page-71">LEE CHANGSOO</a>
        <a href="works.html#page-112">EUN HOSEOK</a>
      </div>
    </nav>
  </header>

  <main>
    <section id="celebration" class="panel image-panel neutral-panel overlay-section">
      <div class="image-wrap">
        <img src="assets/source/전시소개.jpg" alt="Celebration visual" class="panel-image" />
        <div class="top-overlay-buttons" aria-hidden="false">
          <a href="#celebration" class="overlay-button" aria-label="Celebration 섹션"></a>
          <a href="#works" class="overlay-button" aria-label="Works 섹션"></a>
        </div>
      </div>
    </section>

    <section id="works" class="panel image-panel neutral-panel overlay-section">
      <div class="image-wrap">
        <img src="assets/source/전시소개2.jpg" alt="Works visual" class="panel-image" />
        <div class="top-overlay-buttons" aria-hidden="false">
          <a href="#celebration" class="overlay-button" aria-label="Celebration 섹션"></a>
          <a href="#works" class="overlay-button" aria-label="Works 섹션"></a>
        </div>
      </div>
    </section>

  </main>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sideNav = document.querySelector('.side-nav');
    menuToggle.addEventListener('click', () => {
      const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!expanded));
      sideNav.classList.toggle('is-open');
    });
    document.querySelectorAll('.side-nav a').forEach(link => {
      link.addEventListener('click', () => {
        sideNav.classList.remove('is-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
  <script src="fullscroll.js"></script>
</body>
</html>
